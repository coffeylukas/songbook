name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# A newer push to a PR branch supersedes the run in flight. Pushes to main are
# never cancelled: two quick merges would otherwise leave the first commit with
# a cancelled — not green — status, which matters if main's CI ever gates a
# release or deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No version input: pnpm/action-setup reads `packageManager` from
      # package.json, so the pnpm version is defined in exactly one place.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # CI has no real Clerk/Supabase credentials and needs none to build.
          # env.ts is imported by next.config.ts, so the build would otherwise
          # fail fast on the missing vars. Never set this for a real deployment —
          # see "Environment variables" in CLAUDE.md.
          #
          # Deliberately scoped to this step rather than the whole job: the env
          # unit tests assert that validation *does* throw on a bad environment,
          # so an ambient SKIP_ENV_VALIDATION would turn them into no-ops.
          SKIP_ENV_VALIDATION: "1"
